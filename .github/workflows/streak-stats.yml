name: Generate Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC (00:00 em Brasília)
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=yasmim-passos&theme=tokyonight&hide_border=true&border_radius=10
          path: streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "Update streak stats - [Skip GitHub Action]" || exit 0
          git push
